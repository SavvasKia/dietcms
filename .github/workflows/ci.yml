name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Policy gate, not a unit test: its verdict depends on the source TEXT of
      # lib/gdpr.ts, so rename/style churn can red it while the code is correct.
      # Kept out of `pnpm test` so that false red never lands in the save-loop.
      - run: pnpm check:gdpr
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Whether the integration job can run at all. `secrets` is not available in a
  # job-level `if:`, so the presence check has to happen inside a job and be
  # published as an output. Deliberately a WARNING annotation rather than a
  # silent skip: an unconfigured repo would otherwise show all-green CI while
  # every RLS, audit-grant and GDPR-erasure proof went unrun, which is the exact
  # failure this gate was built to end (see .superpowers/sdd/progress.md).
  integration-preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration tests did not run::pnpm test:int is SKIPPED because the Neon credentials are missing. Every tenant-isolation, audit-append-only and GDPR-erasure proof is unverified on this run. To enable: create a 'ci-base' Neon branch (fork from dev — it already carries the authenticated_backend role and its grants, which no migration creates), then add secret NEON_API_KEY and variable NEON_PROJECT_ID."
          fi

  integration:
    needs: integration-preflight
    if: needs.integration-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Throwaway Neon branch per run, forked from a dedicated "ci-base" branch
      # (schema + roles/grants only, no real data) rather than production —
      # deleted unconditionally below, even on failure. authenticated_backend
      # must already exist on ci-base: migrations only GRANT/REVOKE against
      # it, none of them CREATE it (that was done by hand in the foundation
      # work — see .superpowers/sdd/foundation/task-5-pathB-brief.md).
      - name: Create Neon branch (owner role)
        id: neon_owner
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ci-${{ github.run_id }}

      # Second call, same branch_name — reuses the branch just created and
      # only fetches a second role's connection string (documented, supported
      # pattern; does not create a duplicate branch).
      - name: Get authenticated_backend connection string
        id: neon_authed
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ci-${{ github.run_id }}
          role: authenticated_backend

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon_owner.outputs.db_url }}

      - run: pnpm test:int
        env:
          DATABASE_URL: ${{ steps.neon_owner.outputs.db_url }}
          DATABASE_URL_AUTHENTICATED: ${{ steps.neon_authed.outputs.db_url }}

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
