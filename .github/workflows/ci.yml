name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Policy gate, not a unit test: its verdict depends on the source TEXT of
      # lib/gdpr.ts, so rename/style churn can red it while the code is correct.
      # Kept out of `pnpm test` so that false red never lands in the save-loop.
      - run: pnpm check:gdpr
      # Catches a db/schema.ts change with no migration: typecheck, lint and the
      # unit suite all pass on one, and no database would ever have it. Needs no
      # credentials (generate is a schema-vs-snapshot diff), so it belongs here
      # rather than behind the Neon secrets.
      - run: pnpm check:migrations
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  integration:
    # Skipped only where the secrets are unavailable BY DESIGN and no
    # contributor could fix it: GitHub withholds `secrets.*` from pull_request
    # runs originating in a fork, and Dependabot reads a separate store. Without
    # this, the fail-closed check below reds those PRs with an instruction
    # ("add repo secret NEON_API_KEY") their author has no permission to follow.
    # Every push to this repo still runs it, so the fail-closed property holds
    # exactly where someone can act on it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # FAILS the run when the Neon credentials are missing — it does not warn
      # and skip. Skipping would mean an unconfigured repo shows all-green CI
      # while every RLS, audit-grant and GDPR-erasure proof goes unrun, which is
      # precisely the failure .superpowers/sdd/progress.md recorded ("CI HAD
      # NEVER RUN AT ALL") and said not to let default silently. An incomplete
      # CI setup is a blocking incompleteness, not a steady state to route
      # around; make this optional only as an explicit, recorded policy call.
      #
      # A step rather than a preflight job on purpose: `secrets` is not readable
      # from a job-level `if:` (only github/needs/vars/inputs are), and a whole
      # runner billed at 1-minute granularity just to test two variables would
      # sit on the critical path of every push.
      - name: Verify Neon credentials are configured
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=''
          [ -n "$NEON_API_KEY" ] || missing="$missing secret:NEON_API_KEY"
          [ -n "$NEON_PROJECT_ID" ] || missing="$missing var:NEON_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Integration tests cannot run::Missing:$missing — so every tenant-isolation, audit-append-only and GDPR-erasure proof is unverified. To configure: (1) create a 'ci-base' branch in the Neon console, forked from dev because it already carries the authenticated_backend role and its grants, which no migration in this repo creates from scratch; (2) create a Neon API key; (3) add repo secret NEON_API_KEY and repo variable NEON_PROJECT_ID."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Throwaway Neon branch per run, forked from a dedicated "ci-base" branch
      # (schema + roles/grants only, no real data) rather than production —
      # deleted unconditionally below, even on failure. authenticated_backend
      # must already exist on ci-base: migrations only GRANT/REVOKE against
      # it, none of them CREATE it (that was done by hand in the foundation
      # work — see .superpowers/sdd/foundation/task-5-pathB-brief.md).
      - name: Create Neon branch (owner role)
        id: neon_owner
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ci-${{ github.run_id }}

      # Second call, same branch_name — reuses the branch just created and
      # only fetches a second role's connection string (documented, supported
      # pattern; does not create a duplicate branch).
      - name: Get authenticated_backend connection string
        id: neon_authed
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ci-base
          branch_name: ci-${{ github.run_id }}
          role: authenticated_backend

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon_owner.outputs.db_url }}

      - run: pnpm test:int
        env:
          DATABASE_URL: ${{ steps.neon_owner.outputs.db_url }}
          DATABASE_URL_AUTHENTICATED: ${{ steps.neon_authed.outputs.db_url }}

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
